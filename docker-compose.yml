services:
  stockflow:
    build: .
    env_file: .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - stockflow_sessions:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  stockflow_sessions:
